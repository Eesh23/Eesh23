name: Bump stats card year

on:
  schedule:
    - cron: "5 5 1 1 *" # Jan 1, 05:05 UTC (just after midnight Eastern)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update commits_year in README
        run: |
          YEAR=$(date -u +%Y)
          sed -i -E "s/commits_year=[0-9]{4}/commits_year=${YEAR}/g" README.md

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump stats card commits_year to $(date -u +%Y)"
          git push
